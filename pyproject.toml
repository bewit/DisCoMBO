[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "discombo"
version = "1.0.0"
description = "DisCoMBO: Steering Expert-in-the-Loop Black Box Optimization via Distributional Conformance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spflow~=1.1.0",
    "torch>=2.1",
    "numpy>=1.26.4",
    "scipy>=1.10",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["discombo*"]
